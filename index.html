,text:"Hrubé mzdy zamestnancov za mesiac 2 000 € (vyplatia sa v nasledujúcom mesiaci).",amount:2e3,md:"N",d:"KZ",tax:null,why:"Mzdy sú náklad a daňový výdavok. Kým nie sú vyplatené, firma ich dlhuje zamestnancom (KZ)."},{id:"z07",topic:"zaklady",text:"Ročný odpis kávovaru 640 € (účtovný odpis sa rovná daňovému).",amount:640,md:"N",d:"NM",tax:null,why:"Odpis prenáša časť ceny majetku do nákladov - hodnota neobežného majetku klesne. Keď sa účtovný odpis rovná daňovému, netreba nič upravovať."},{id:"z08",topic:"zaklady",text:"Banka poskytla úver 10 000 € splatný o tri roky, peniaze prišli na účet.",amount:1e4,md:"OM",d:"DZ",tax:null,why:"Úver nie je výnos - peniaze firme pribudli, ale rovnako jej pribudol dlh. Je splatný o viac ako rok, preto dlhodobý záväzok."},{id:"z09",topic:"zaklady",text:"Splátka istiny bankového úveru 1 000 € z účtu.",amount:1e3,md:"DZ",d:"OM",tax:null,why:"Istina nie je náklad - firma len vracia požičané peniaze. Klesne dlh aj peniaze, výsledok hospodárenia sa nemení."},{id:"z10",topic:"zaklady",text:"Banka strhla z účtu úrok z úveru 80 €.",amount:80,md:"N",d:"OM",tax:null,why:"Úrok z úveru je cena za požičané peniaze - náklad a daňový výdavok."},{id:"z11",topic:"zaklady",text:"Spotreba kávy zo skladu za mesiac 500 €.",amount:500,md:"N",d:"OM",tax:null,why:"Zásoby sa spotrebovali - hodnota obežného majetku sa zmenila na náklad."},{id:"z12",topic:"zaklady",text:"Odberateľ zaplatil faktúru 1 200 € na bankový účet.",amount:1200,md:"OM",d:"OM",tax:null,why:"Pohľadávka (OM) sa zmenila na peniaze (OM). Výnos bol zaúčtovaný už pri vystavení faktúry, inkaso ho neopakuje."},{id:"p01",topic:"ppop",text:"Pohostenie obchodných partnerov v reštaurácii 600 €, zaplatené firemnou kartou.",amount:600,md:"N",d:"OM",tax:{typ:"PP",suma:600,riadok:"tab. A r. 6 → r. 130",par:"§ 21 ods. 1 písm. h)",link:Pe("paragraf-21.odsek-1.pismeno-h")},why:"Reprezentácia nie je daňovým výdavkom nikdy. Výsledok hospodárenia klesne, ale v priznaní sa celá suma pripočíta späť."},{id:"p02",topic:"ppop",text:"Faktúra za nájom kancelárie za december 1 500 €, zaplatí sa až v januári nasledujúceho roka.",amount:1500,md:"N",d:"KZ",tax:{typ:"PP",suma:1500,riadok:"r. 140",par:"§ 17 ods. 19 písm. b)",link:Pe("paragraf-17.odsek-19")},why:"Nájomné je daňovým výdavkom až po zaplatení. Kým nie je zaplatené, vráti sa do základu dane ako PP - v roku zaplatenia sa odpočíta."},{id:"p03",topic:"ppop",text:"V januári firma zaplatila nájomné za december minulého roka 1 500 € (minulý rok bolo PP v r. 140).",amount:1500,md:"KZ",d:"OM",tax:{typ:"OP",suma:1500,riadok:"r. 270",par:"§ 17 ods. 19 písm. b)",link:Pe("paragraf-17.odsek-19")},why:"Úhrada dlhu výsledok hospodárenia nemení. Až teraz je však nájomné zaplatené, a teda daňovým výdavkom - základ dane sa zníži. Takto sa výdavok len presunul do roka zaplatenia."},{id:"p04",topic:"ppop",text:"Pokuta od daňového úradu 200 € za oneskorené podanie kontrolného výkazu (zatiaľ nezaplatená).",amount:200,md:"N",d:"KZ",tax:{typ:"PP",suma:200,riadok:"tab. A r. 16 → r. 130",par:"§ 21 ods. 2 písm. a)",link:Pe("paragraf-21.odsek-2.pismeno-a")},why:"Pokuty a penále nie sú daňovým výdavkom - štát by si inak sám znížil pokutu cez nižšiu daň."},{id:"p05",topic:"ppop",text:"Faktúra advokátskej kancelárie za právne služby 800 €, do konca roka nezaplatená.",amount:800,md:"N",d:"KZ",tax:{typ:"PP",suma:800,riadok:"r. 140",par:"§ 17 ods. 19 písm. f)",link:Pe("paragraf-17.odsek-19")},why:"Právne a poradenské služby sú daňovým výdavkom až po zaplatení - rovnako ako nájomné."},{id:"p06",topic:"ppop",text:"Reklamné perá s logom firmy, 100 ks po 5 € (spolu 500 €), rozdané zákazníkom na veľtrhu; faktúra nezaplatená.",amount:500,md:"N",d:"KZ",tax:null,why:"Reklamné predmety do 17 € za kus nie sú reprezentáciou, sú daňovým výdavkom (výnimka v § 21 ods. 1 písm. h)). Netreba nič upravovať."},{id:"p07",topic:"ppop",text:"Faktúra za marketingovú štúdiu 2 000 €, zaplatená v tom istom roku.",amount:2e3,md:"N",d:"KZ",tax:null,why:"Štúdie sú daňovým výdavkom po zaplatení (§ 17 ods. 19 písm. c)). Zaplatená bola ešte v tom istom roku, preto sa nič neupravuje."},{id:"o01",topic:"opravne",text:"Opravná položka 100 % k pohľadávke 6 000 € (500 dní po splatnosti, dlžník nie je v konkurze).",amount:6e3,md:"N",d:"OM",tax:{typ:"PP",suma:4800,riadok:"tab. A r. 9 → r. 130",par:"§ 20 ods. 14 písm. a)",link:Pe("paragraf-20.odsek-14")},why:"Po 360 dňoch od splatnosti je daňová len opravná položka do 20 % pohľadávky (1 200 €). Zvyšných 4 800 € je PP."},{id:"o02",topic:"opravne",text:"Rezerva na overenie účtovnej závierky audítorom 2 000 €.",amount:2e3,md:"N",d:"KZ",tax:{typ:"PP",suma:2e3,riadok:"tab. A r. 10 → r. 130",par:"§ 20 ods. 9, § 21 ods. 2 písm. j)",link:Pe("paragraf-20.odsek-9")},why:"Rezerva na audit nie je v zozname daňových rezerv. Náklad sa stane daňovým až vtedy, keď sa rezerva použije na skutočnú faktúru."},{id:"o03",topic:"opravne",text:"Prišla faktúra audítora za audit minulého roka 2 000 €, firma na ňu použila rezervu (minulý rok PP).",amount:2e3,md:"KZ",d:"KZ",tax:{typ:"OP",suma:2e3,riadok:"r. 290",par:"§ 17 ods. 23",link:Pe("paragraf-17.odsek-23")},why:"Rezerva (KZ) sa len zmenila na záväzok voči audítorovi (KZ) - výsledok hospodárenia sa nemení. Náklad sa však stal skutočným a daňovým, preto sa základ dane zníži."},{id:"o04",topic:"opravne",text:"Rezerva na nevyčerpané dovolenky vrátane poistného 3 000 €.",amount:3e3,md:"N",d:"KZ",tax:null,why:"Rezerva na nevyčerpané dovolenky vrátane poistného je daňovým výdavkom priamo zo zákona (§ 20 ods. 9 písm. a)) - na rozdiel od rezervy na audit."},{id:"o05",topic:"opravne",text:"Dlžník zaplatil, firma zrušila opravnú položku 1 000 €, ktorej tvorba nebola daňovým výdavkom.",amount:1e3,md:"OM",d:"N",tax:{typ:"OP",suma:1e3,riadok:"r. 290",par:"§ 17 ods. 23",link:Pe("paragraf-17.odsek-23")},why:"Zrušenie opravnej položky zníži náklady, teda zvýši výsledok hospodárenia. Keďže jej tvorba nebola daňová, zrušenie sa do základu dane nezahŕňa - inak by sa ten istý náklad zdanil dvakrát."},{id:"v01",topic:"zavazky",text:"Firma zaplatila dodávateľovi starý záväzok 4 000 €, o ktorý v minulých rokoch zvýšila základ dane na 100 %.",amount:4e3,md:"KZ",d:"OM",tax:{typ:"OP",suma:4e3,riadok:"r. 290",par:"§ 17 ods. 32 písm. a)",link:Pe("paragraf-17.odsek-32")},why:"Úhrada výsledok hospodárenia nemení. Pretože firma záväzok v minulosti celý dodanila, po zaplatení si základ dane zníži späť."},{id:"v02",topic:"zavazky",text:"Dodávateľ odpustil záväzok 10 000 €, o ktorý firma doteraz zvýšila základ dane o 20 % (2 000 €).",amount:1e4,md:"KZ",d:"V",tax:{typ:"OP",suma:2e3,riadok:"r. 290",par:"§ 17 ods. 32 písm. b)",link:Pe("paragraf-17.odsek-32")},why:"Zánik dlhu je výnos (+10 000 €). Firma si však už 2 000 € dodanila, preto základ dane zníži o túto sumu - inak by ich zdanila druhýkrát."},{id:"v03",topic:"zavazky",text:"Spoločník požičal firme 20 000 € na účet, vrátiť ich má do roka.",amount:2e4,md:"OM",d:"KZ",tax:null,why:"Pôžička nie je výnos a jej istina nikdy nebude nákladom. Preto ani pri omeškaní splátky sa základ dane o istinu nezvyšuje."},{id:"v04",topic:"zavazky",text:"Faktúra za materiál na sklad 12 300 € (vrátane DPH) - prijatá, nezaplatená.",amount:12300,md:"OM",d:"KZ",tax:null,why:"Materiál na sklade je obežný majetok - náklad vznikne až pri spotrebe. Ak by faktúra zostala nezaplatená viac ako 360 dní, základ dane by sa mimoúčtovne zvýšil o 20 % (§ 17 ods. 27)."},{id:"d01",topic:"dan",text:"Firma zaplatila preddavok na daň z príjmov 1 500 €.",amount:1500,md:"DU",d:"OM",tax:null,why:"Preddavok nie je náklad - je to záloha na daň. Vznikne pohľadávka voči daňovému úradu, ktorá sa na konci roka započíta so skutočnou daňou."},{id:"d02",topic:"dan",text:"Na konci roka firma zaúčtovala splatnú daň z príjmov za rok 8 000 €.",amount:8e3,md:"ND",d:"DU",tax:null,why:"Daň z príjmov je náklad (ND), ktorý zníži výsledok hospodárenia po zdanení. Základ dane sa však počíta z výsledku pred zdanením (r. 100) - daň sama seba neznižuje."},{id:"d03",topic:"dan",tex
